# HTTP
server {
    listen 80;
    server_name localhost myapp.test kasaman.am www.kasaman.am;

    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    # На сервере будет редирект на HTTPS
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# HTTPS блок (только для сервера с сертификатами)
# Если локально сертификатов нет — Nginx этот блок просто игнорирует
server {
    listen 443 ssl http2;
    server_name kasaman.am www.kasaman.am;

    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/kasaman.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kasaman.am/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
